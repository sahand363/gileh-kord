name: GILEH KORD CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript and Svelte checks
        run: npm run check

      - name: Run Vitest unit and repository tests
        run: npm test

      - name: Build production frontend bundle
        run: npm run build

      - name: Verify SSH installer script syntax
        run: bash -n install.sh
